<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Leonardo Celija — Commercial & Advisory CV in Swedish and English.">
  <title>Leonardo Celija | Commercial & Advisory CV</title>
  <style>
    :root {
      --ink: #172033;
      --navy: #0f172a;
      --teal: #0f766e;
      --teal-light: #5eead4;
      --paper: #ffffff;
      --canvas: #edf1f5;
      --line: #dce3ea;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(760px, 100%);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
    }

    header {
      padding: 48px;
      color: #ffffff;
      background: var(--navy);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--teal-light);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.4rem);
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .subtitle {
      margin: 16px 0 0;
      color: #cbd5e1;
      font-size: 1.1rem;
    }

    .languages {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 34px;
    }

    a {
      display: block;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 14px;
      transition: transform 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    a:hover {
      transform: translateY(-2px);
      border-color: #99d7d0;
      box-shadow: 0 10px 28px rgba(15, 118, 110, 0.10);
    }

    strong {
      display: block;
      margin-bottom: 5px;
      color: var(--teal);
      font-size: 1.2rem;
    }

    span {
      color: #64748b;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      header { padding: 36px 28px; }
      .languages { grid-template-columns: 1fr; padding: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Commercial &amp; Advisory CV</p>
      <h1>Leonardo Celija</h1>
      <p class="subtitle">Välj språk · Select language</p>
    </header>

    <nav class="languages" aria-label="Välj CV-språk">
      <a href="commercial-advisory-cv-sv.html" lang="sv">
        <strong>Svenska</strong>
        <span>Kommersiellt CV &amp; rådgivarprofil</span>
      </a>
      <a href="commercial-advisory-cv-en.html" lang="en">
        <strong>English</strong>
        <span>Commercial &amp; Advisory CV</span>
      </a>
    </nav>
  </main>
</body>
</html>
